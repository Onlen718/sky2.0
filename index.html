<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Morning, Jisoo ☀️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
            transition: background 3s ease;
        }

        /* Небо */
        .sky {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            background: linear-gradient(180deg, #0a0a2a 0%, #1a1a4a 50%, #FF6B6B 100%);
            animation: sunrise 8s ease-in-out infinite alternate;
        }
        @keyframes sunrise {
            0% { background: linear-gradient(180deg, #0a0a2a 0%, #1a1a4a 50%, #FF6B6B 100%); }
            100% { background: linear-gradient(180deg, #1a1a4a 0%, #FFA07A 50%, #FFD700 100%); }
        }

        /* Солнце */
        .sun {
            position: fixed;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 120px; height: 120px;
            background: radial-gradient(circle, #FFD700, #FFA500);
            border-radius: 50%;
            box-shadow: 0 0 100px #FFD700, 0 0 200px #FFA500;
            z-index: 1;
            animation: sunRise 8s ease-in-out infinite alternate;
        }
        @keyframes sunRise {
            0% { bottom: 10%; opacity: 0.5; }
            100% { bottom: 40%; opacity: 1; }
        }

        /* Цветы */
        .flower {
            position: fixed;
            bottom: 0;
            font-size: 2rem;
            z-index: 2;
            animation: grow 3s ease-out forwards;
            transform-origin: bottom center;
        }
        @keyframes grow {
            0% { transform: scaleY(0); opacity: 0; }
            100% { transform: scaleY(1); opacity: 1; }
        }

        /* Текст */
        h1 {
            position: relative;
            z-index: 10;
            color: #fff;
            font-size: 2.5rem;
            text-align: center;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            margin-bottom: 10px;
            opacity: 0;
            animation: textAppear 2s ease-in-out 3s forwards;
        }
        .subtitle {
            position: relative;
            z-index: 10;
            color: #FFD700;
            font-size: 1.2rem;
            text-align: center;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            margin-bottom: 30px;
            opacity: 0;
            animation: textAppear 2s ease-in-out 4s forwards;
        }
        @keyframes textAppear {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Кнопка */
        .button {
            position: relative;
            z-index: 10;
            background: linear-gradient(135deg, #FFD700, #FF69B4);
            color: #0a0a2a;
            border: none;
            padding: 18px 50px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            transition: all 0.3s;
            opacity: 0;
            animation: textAppear 2s ease-in-out 5s forwards;
        }
        .button:active { transform: scale(0.95); }

        /* Летящие элементы */
        .fly {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            z-index: 100;
            animation: flyUp 4s ease-out forwards;
        }
        @keyframes flyUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="sky"></div>
    <div class="sun"></div>

    <h1>Good morning, my love ☀️</h1>
    <p class="subtitle">I love you more than words can say ❤️</p>
    <button class="button" onclick="showLove()">Press me 💛</button>

    <script>
        // Цветы
        for (let i = 0; i < 20; i++) {
            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.textContent = ['🌸', '🌹', '🌷', '🌻', '💐'][Math.floor(Math.random() * 5)];
            flower.style.left = Math.random() * 100 + '%';
            flower.style.animationDelay = Math.random() * 3 + 's';
            document.body.appendChild(flower);
        }

        // Летящие бабочки и сердечки
        function showLove() {
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const fly = document.createElement('div');
                    fly.className = 'fly';
                    fly.textContent = ['🦋', '❤️', '💛', '💖', '🌸', '✨'][Math.floor(Math.random() * 6)];
                    fly.style.left = Math.random() * 100 + '%';
                    fly.style.bottom = '0';
                    fly.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    fly.style.animationDuration = (3 + Math.random() * 2) + 's';
                    document.body.appendChild(fly);
                    setTimeout(() => fly.remove(), 5000);
                }, i * 80);
            }
        }
    </script>
</body>
</html>
