<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Jisoo ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #0a0a2a, #1a1a4a);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: 'Segoe UI', sans-serif; overflow: hidden; padding: 20px;
            position: relative;
        }

        /* Звёзды */
        .star {
            position: absolute; width: 2px; height: 2px;
            background: white; border-radius: 50%;
            animation: twinkle 2s infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Персонажи */
        .scene {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            z-index: 10;
            margin-bottom: 30px;
        }
        .character {
            font-size: 8rem;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.3));
        }
        .character.robot {
            animation-delay: 0.5s;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Сердце между ними */
        .heart-between {
            font-size: 4rem;
            animation: pulse 1.5s infinite;
            filter: drop-shadow(0 0 30px rgba(255, 69, 180, 0.8));
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        /* Текст */
        h1 {
            color: #FFD700;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            z-index: 10;
            text-align: center;
            animation: glow 2s infinite;
        }
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
            50% { text-shadow: 0 0 40px rgba(255, 215, 0, 1); }
        }
        .subtitle {
            color: #87CEEB;
            font-size: 1.2rem;
            margin-bottom: 20px;
            z-index: 10;
            text-align: center;
        }

        /* Кнопка */
        .button {
            background: linear-gradient(135deg, #FFD700, #FF69B4);
            color: #0a0a2a;
            border: none;
            padding: 18px 50px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            transition: all 0.3s;
            z-index: 10;
        }
        .button:active { transform: scale(0.95); }

        /* Летящие сердечки */
        .heart {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            z-index: 100;
            animation: floatUp 3s ease-out forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(0.3); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="character">🦆</div>
        <div class="heart-between">❤️</div>
        <div class="character robot">🤖</div>
    </div>

    <h1>Jisoo, ты — моя вселенная</h1>
    <p class="subtitle">I love you more than words can say ❤️</p>
    <button class="button" onclick="showLove()">Нажми меня 💛</button>

    <script>
        // Звёзды
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(star);
        }

        // Сердечки при нажатии
        function showLove() {
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.textContent = ['❤️', '💛', '💙', '💖', '💝', '💕', '💞'][Math.floor(Math.random() * 7)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.bottom = '0';
                    heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    heart.style.animationDuration = (2 + Math.random() * 1.5) + 's';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 3500);
                }, i * 60);
            }
        }

        // Музыка (Memories)
        const audio = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
        audio.loop = true;
        audio.volume = 0.3;
        document.body.addEventListener('click', () => {
            audio.play().catch(() => {});
        }, { once: true });
    </script>
</body>
</html>
